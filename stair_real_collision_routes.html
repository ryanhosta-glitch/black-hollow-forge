<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real Stair Collision Candidates</title><style>body{background:#150e21;color:#f2e3d6;font:16px system-ui;margin:0 auto;max-width:900px;padding:22px}a{color:#ffcb7c}section{border:1px solid #795e68;border-radius:10px;margin:16px 0;padding:15px;background:#241827}small{color:#ccadb2}code{color:#f6c489}</style><h1>🦇 Ferre’s Estate — Real Stair Collision Candidates</h1><p>Derived directly from exported tread GLBs. These are <strong>preview candidates only</strong>; live Rapier collision has not been certified.</p><p><a href="index.html">← Back to Forge</a></p><main id="results">Loading report…</main><script>fetch('houses/ferres-estate/navigation/stair_rapier_route_candidates.json').then(r=>r.json()).then(data=>{document.querySelector('#results').innerHTML=data.routes.map(r=>`<section><h2>${r.id} — ${r.kind}</h2><p>${r.treadCount} exported treads · ${r.collisionSegmentCount} candidate segments</p><p><b>${r.issues.length} geometry warnings</b> · <b>NOT gameplay-certified</b></p>${r.issues.slice(0,12).map(i=>`<p><small>Segment ${i.segment}: ${i.reason} ${i.lengthMeters||i.riseMeters||''} m</small></p>`).join('')}<small>Headroom and continuous Rapier capsule traversal have not been run.</small></section>`).join('')}).catch(e=>document.querySelector('#results').textContent='Open through GitHub Pages or a local web server: '+e.message)</script></html>
