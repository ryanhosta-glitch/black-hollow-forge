<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Hollow — Furniture Atelier 2.5</title><style>body{margin:0;background:#151218;color:#eadbc5;font:14px system-ui}header{padding:14px 18px;background:#27202b;display:flex;justify-content:space-between;gap:10px;align-items:center}h1{margin:0;font:23px Georgia,serif}a{color:#dbbe86}#stage{height:74vh;touch-action:none}section{padding:12px 18px;line-height:1.6}label{margin-right:22px}select,input{accent-color:#c9a469}small{color:#b9acb2}</style><header><h1>BLACK HOLLOW · FURNITURE ATELIER 2.5</h1><a href="index.html">Back to Forge</a></header><section>Six dimensional Victorian furniture models · drag to orbit, scroll to zoom. No automatic room placement yet.<p><label>Age <input type="range" id="age" min="0" max="1" step=".05" value=".32"></label><label>Quality <select id="quality"><option value="standard">Standard</option><option value="mobile">Mobile</option></select></label></p><small>Bookcase · Writing desk · Armchair · Settee · Dining table · Wardrobe. Furniture can repeat throughout any house; portraits cannot.</small></section><div id="stage"></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';import {buildFurnitureShowcase} from './victorian_furniture_library.js';const el=document.getElementById('stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0x18171b);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;el.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(47,1,.05,150);camera.position.set(9,8,13);const ctl=new OrbitControls(camera,renderer.domElement);ctl.target.set(0,.8,0);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xe4ecff,0x4a3020,2.2));const sun=new THREE.DirectionalLight(0xffdfaf,3);sun.position.set(-4,8,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x393038,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);let models=null;function redraw(){if(models){scene.remove(models);models.traverse(o=>{o.geometry?.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())})}models=buildFurnitureShowcase(THREE,{age:+document.getElementById('age').value,quality:document.getElementById('quality').value});scene.add(models)}document.getElementById('age').oninput=redraw;document.getElementById('quality').onchange=redraw;redraw();function resize(){renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,camera)}loop();</script></html>
