<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Hollow — Beautiful but Abandoned</title><style>body{margin:0;background:#131019;color:#eee;font:15px system-ui}header{padding:12px 18px;background:#211a27;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:19px;color:#dfba7c;margin:0}#info{padding:12px 20px;background:#211a27}#info select,#info button{font:inherit;background:#352b3d;color:white;border:1px solid #907657;border-radius:6px;padding:7px;margin-right:6px}#view{height:67vh}#error{color:#f7b59d}small{color:#c2b7c9}a{color:#efd29f}</style><header><h1>Forge — Beautiful but Abandoned</h1><a href="index.html">Back to Forge</a></header><div id="info">Floor: <select id="floor"></select><button id="fit">Fit</button><label><input type="checkbox" id="structure" checked> Show original structure</label><p id="status">Loading…</p><small>Architect-authored geometry remains unchanged. Furniture overlays are visual proposals: collision and door approaches require playtesting.</small><p id="error"></p></div><div id="view"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const host=document.getElementById('view'),r=new THREE.WebGLRenderer({antialias:true});r.setSize(host.clientWidth,host.clientHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.setClearColor(0x15121c);host.appendChild(r.domElement);const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x444151,2.2));const sun=new THREE.DirectionalLight(0xffe3bb,2.5);sun.position.set(25,30,20);scene.add(sun);const camera=new THREE.PerspectiveCamera(48,host.clientWidth/host.clientHeight,.1,500);camera.position.set(24,25,36);const controls=new OrbitControls(camera,r.domElement);const loader=new GLTFLoader(),group=new THREE.Group();scene.add(group);const sel=document.getElementById('floor');for(let f=0;f<4;f++){const o=document.createElement('option');o.value=f;o.textContent=['Basement','Ground Floor','Second Floor','Third Floor'][f];sel.append(o)}let floor=1;const loaded=new Map();const load=async(path)=>{if(loaded.has(path))return loaded.get(path).clone(true);let m=await new Promise((resolve,reject)=>loader.load(path,x=>resolve(x.scene),undefined,reject));loaded.set(path,m);return m.clone(true)};function fit(){const bb=new THREE.Box3().setFromObject(group);if(bb.isEmpty())return;const center=bb.getCenter(new THREE.Vector3()),s=bb.getSize(new THREE.Vector3());controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(s.x*1.4+5,s.y*1.8+14,s.z*1.4+5));camera.near=.1;camera.far=600;camera.updateProjectionMatrix();controls.update()}async function draw(){const token=++draw.token;group.clear();document.getElementById('status').textContent='Loading floor '+floor+'…';const base='houses/ferres-estate/geometry/';try{const [shell,props]=await Promise.all([load(base+'floor_'+String(floor).padStart(2,'0')+'.glb'),load(base+'furnishings_floor_'+String(floor).padStart(2,'0')+'.glb')]);if(token!==draw.token)return;shell.visible=document.getElementById('structure').checked;group.add(shell);group.add(props);fit();const p=await fetch('houses/ferres-estate/navigation/furnishing_plan.json').then(x=>x.json());const rooms=p.rooms.filter(x=>x.floor===floor);document.getElementById('status').textContent=rooms.length+' rooms · '+rooms.reduce((a,x)=>a+x.objects,0)+' furnishing placements · decorative preview';}catch(e){document.getElementById('error').textContent='Model loading failed: '+e.message;document.getElementById('status').textContent='Check GitHub Pages asset paths.'}}draw.token=0;sel.value=1;sel.onchange=()=>{floor=+sel.value;draw()};document.getElementById('structure').onchange=()=>{for(const child of group.children.slice(0,1))child.visible=document.getElementById('structure').checked};document.getElementById('fit').onclick=fit;function animate(){requestAnimationFrame(animate);controls.update();r.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();r.setSize(host.clientWidth,host.clientHeight)});draw();</script></html>
