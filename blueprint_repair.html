<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge — Blueprint Repair Intelligence</title><style>body{background:#10121a;color:#eee9df;font:16px system-ui;margin:auto;max-width:1050px;padding:20px}header{border-bottom:1px solid #584963;padding:12px 0}a{color:#f3bf8b}article{background:#201e2a;margin:14px 0;border:1px solid #54445b;border-radius:12px;padding:18px}small{color:#d6b37f}button{background:#573f60;border:1px solid #a18ba6;border-radius:8px;color:white;padding:10px;cursor:pointer}input,select{background:#181620;color:white;border:1px solid #786982;padding:10px;font-size:16px;max-width:100%}p{line-height:1.45}h1{font-size:1.7rem}</style><header><a href="index.html">← Estate Viewer</a><h1>Blueprint Repair Intelligence</h1><p>Read-only suggestions. No student architecture is automatically changed.</p></header><section><p id="summary">Loading…</p><label>Severity <select id="severity"><option value="">All</option><option>blocker</option><option>warning</option><option>advisory</option></select></label> <label>Find <input id="search" placeholder="Room, issue, repair…"></label><button id="export">Download report</button></section><main id="cards"></main><script>let report;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(){const severity=document.querySelector('#severity').value,q=document.querySelector('#search').value.toLowerCase();const matches=report.issues.filter(i=>(!severity||i.severity===severity)&&JSON.stringify(i).toLowerCase().includes(q));document.querySelector('#summary').textContent=`${report.roomCount} rooms · ${report.floorCount} floors · ${report.issueCount} diagnostic findings · ${matches.length} shown`;document.querySelector('#cards').innerHTML=matches.map(i=>`<article><small>${esc(i.severity.toUpperCase())} · ${esc(i.code)} · ${esc(i.id)}</small><h2>${esc(i.title)}</h2><p>${esc(i.details)}</p><p><b>Rooms:</b> ${esc(i.roomIds.join(', ')||'—')}</p>${i.proposals.map(p=>`<p><b>Repair option ${p.rank} (review required):</b> ${esc(p.action)}</p>`).join('')}</article>`).join('')||'<p>No results match this filter.</p>'}fetch('./houses/ferres-estate/blueprint_repair_report.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{report=d;show()}).catch(e=>document.querySelector('#summary').textContent='Could not load report. Publish on a web server / GitHub Pages: '+e);document.querySelector('#severity').onchange=()=>report&&show();document.querySelector('#search').oninput=()=>report&&show();document.querySelector('#export').onclick=()=>{if(!report)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='blueprint_repair_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};</script></html>
