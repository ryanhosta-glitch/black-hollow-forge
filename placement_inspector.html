<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge Placement Inspector</title><style>body{background:#100d15;color:#f4e2cf;font:16px/1.5 system-ui;margin:24px auto;max-width:950px;padding:0 16px}a{color:#efc98e}h1{font:32px Georgia}article{padding:16px;border:1px solid #715d52;border-radius:12px;margin:12px 0;background:#201827}.muted{color:#c0adab}</style><a href="index.html">← Return to Gallery</a><h1>Placement Inspector · 1.7</h1><p>Checks generated object clearance in authored rooms. Warnings are conservative, not proven 3D collisions. Student walls, rails, and doors are untouched.</p><div id="result"></div><script>fetch('houses/ferres-estate/navigation/placement_review_1_7.json').then(r=>r.json()).then(d=>{const p=document.querySelector('#result');p.innerHTML='<p>'+d.scannedRooms+' rooms · '+d.scannedFurnishings+' furniture placements · '+d.checks.length+' warnings</p>';for(const w of d.checks){const a=document.createElement('article');a.textContent=w.room+' — '+(w.object||w.kind)+' : '+w.warning;p.append(a)}if(!d.checks.length){const a=document.createElement('p');a.textContent='No boundary warnings from the simple screening; this does NOT mean collision verified.';p.append(a)}const s=document.createElement('p');s.className='muted';s.textContent=d.limitations;p.append(s)}).catch(e=>document.querySelector('#result').textContent=e.message)</script></html>
