<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge | Staircase Solver</title><link rel="stylesheet" href="./forge_pages.css"><style>
:root{color-scheme:dark}body{margin:0;background:#10121a;color:#eee4d4;font:15px system-ui,sans-serif;padding:20px 15px 90px;max-width:1050px;margin:auto}h1{color:#e6c38b}p{line-height:1.5}.summary{padding:12px;border:1px solid #665138;border-radius:10px;background:#25212a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{padding:13px;border:1px solid #514657;border-radius:12px;background:#1d202b}.candidate{padding:8px 0;border-top:1px solid #43404b}.ok{color:#96cbb2}.bad{color:#d4a0a0}small{color:#c2bac5}.tags{margin:8px 0}.tags span{display:inline-block;padding:3px 7px;border:1px solid #76684d;border-radius:7px;margin:3px;font-size:12px}button{padding:9px;border-radius:7px;background:#564363;color:white;border:1px solid #92809e}a{color:#e6c38b}#loading{min-height:30px}</style></head><body><h1>🦇 Staircase Configuration Solver</h1><p>A reusable structural <strong>footprint screening</strong> pass for student stairwells. Candidates that fit are <strong>not certified playable</strong> until door approaches, real mesh geometry, landings and headroom pass physical tests.</p><div id="loading">Loading stair configurations…</div><div id="results" class="grid"></div><script>
fetch('houses/ferres-estate/navigation/stair_multi_layout_solver.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{
 let s=data.summary;document.getElementById('loading').innerHTML=`<div class="summary"><strong>${s.links} vertical links</strong> · ${s.withFootprintCandidates} have possible footprint layouts · ${s.physicallyCertified} physically certified<br><small>Original blueprint preserved. The recommended configuration is not automatically substituted for the authored stair.</small></div>`;
 let container=document.getElementById('results');data.links.forEach(l=>{let el=document.createElement('section');el.className='card';let title=document.createElement('h2');title.textContent=l.linkId+' · '+l.authoredType;el.append(title);
 let dim=document.createElement('p');dim.textContent=`Available ${l.availableFootprintM.join(' × ')} m · rise ${l.riseM} m`;el.append(dim);
 let summary=document.createElement('p');summary.className=l.fittingCandidateCount?'ok':'bad';summary.textContent=l.fittingCandidateCount?`${l.fittingCandidateCount} footprint-compatible layouts. Leading candidate: ${l.preferredFootprintCandidate.replaceAll('_',' ')}`:'No candidate passes this conservative footprint screen.';el.append(summary);
 l.candidates.forEach(c=>{let d=document.createElement('div');d.className='candidate';let label=document.createElement('strong');label.className=c.fitsBoundingRectangle?'ok':'bad';label.textContent=(c.fitsBoundingRectangle?'✓ ':'× ')+c.kind.replaceAll('_',' ');d.append(label);let details=document.createElement('div');details.textContent=`Needs ${c.footprintRequiredM.join(' × ')} m · ${c.riserCount} risers · ${c.riserHeightM} m riser`;d.append(details);if(c.fittingOrientations.length){let sub=document.createElement('small');sub.textContent='Allowed orientation(s): '+c.fittingOrientations.map(o=>o.orientation).join(', ');d.append(sub)}el.append(d)});container.append(el)})
}).catch(err=>{document.getElementById('loading').textContent='Could not load staircase report: '+err.message})
</script><script src="forge_pages.js" defer></script></body></html>
