<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Hollow — Searchable Discoveries</title><style>body{font-family:Georgia,serif;background:#111018;color:#f4e8d2;margin:0;padding:16px;max-width:920px;margin:auto}header{border-bottom:1px solid #8c744c;padding-bottom:12px}select,button,input{font:inherit;padding:10px;background:#29212b;color:#fff;border:1px solid #a68c5e;border-radius:5px}button{cursor:pointer;margin:4px}article{background:#211c26;padding:14px;border:1px solid #53455a;border-radius:8px;margin:12px 0}.muted{color:#c4b2ba}.find{border-left:3px solid #a99060;padding:8px;margin:8px 0;background:#2c2430}#log{white-space:pre-line;background:#29212b;padding:12px}a{color:#e7cb86}</style><header><h1>Searchable Furniture & Discoveries</h1><p>Pass 5 interactive catalog · demonstrations only · <a href="index.html">Estate Viewer</a></p></header><p><label>Floor <select id="floor"><option value="all">All floors</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label> <label>Search <input id="query" placeholder="room or object"></label></p><p><button id="save">Download save JSON</button><label>Load saved state <input id="load" type="file" accept="application/json"></label></p><p id="stats"></p><section id="list"></section><p id="log" aria-live="polite"></p><script type="module">
import {createDiscoveryRuntime} from './discovery_runtime.mjs';
const catalog=await (await fetch('./houses/ferres-estate/navigation/searchable_discoveries.json')).json();const rt=createDiscoveryRuntime(catalog,{onEvent:e=>document.querySelector('#log').textContent=JSON.stringify(e,null,2)});
const el=id=>document.getElementById(id);function make(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e;}
function btn(parent,text,fn){const b=make('button',text);b.addEventListener('click',fn);parent.append(b);}
function render(){el('list').replaceChildren();const floor=el('floor').value,q=el('query').value.toLowerCase();let count=0;for(const o of rt.objects.values()){
 if(floor!=='all'&&o.floor!==Number(floor))continue;if(!`${o.roomName} ${o.archetype}`.toLowerCase().includes(q))continue;count++;
 const card=make('article','');card.append(make('h3',o.roomName+' — '+o.archetype.replaceAll('_',' ')),make('p',`Floor ${o.floor} · ${o.openRequired?'Open before searching':'Inspect to search'} · placement not certified`,'muted'));
 if(o.openRequired)btn(card,o.open?'Close':'Open',()=>{rt.apply(o.objectId,o.open?'close':'open');render()});btn(card,'Search',()=>{const r=rt.apply(o.objectId,'search');if(!r.ok)el('log').textContent=r.reason;render()});
 for(const c of o.contents){if(c.state==='undiscovered')continue;const f=make('div',`${c.description} [${c.state}]`,'find');if(c.state==='revealed')btn(f,c.action==='take'?'Take':'Read',()=>{rt.apply(o.objectId,c.action,c.id);render()});card.append(f)}
 if(!o.contents.length)card.append(make('p','Nothing hidden here.','muted'));el('list').append(card)}el('stats').textContent=`${count} furnishings shown · ${rt.inventory.size} discoveries collected · ${catalog.objects.length} total objects`;}
el('floor').onchange=render;el('query').oninput=render;el('save').onclick=()=>{const blob=new Blob([JSON.stringify(rt.save(),null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='black_hollow_discovery_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};el('load').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());el('log').textContent=rt.load(data)?'Save loaded':'Incompatible save schema';render()}catch(err){el('log').textContent=err.message}};render();
</script></html>
