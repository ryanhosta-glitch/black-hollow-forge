<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serpent Spiral Approach — Forge</title><link rel="stylesheet" href="forge_pages.css"><style>body{margin:0;background:#10131c;color:#f3e7db;font:15px system-ui;padding:18px 12px 90px}main{max-width:1024px;margin:auto}h1{color:#e1bd88}#view{width:100%;height:min(58vh,580px);border:1px solid #786a5c;border-radius:12px;overflow:hidden}pre{white-space:pre-wrap;background:#232533;border-radius:10px;padding:12px;line-height:1.5}p{line-height:1.5}</style></head><body><main><h1>🦇 Serpent Spiral — Aligned Candidate</h1><p>Aligned 360° spiral geometry, connected approach planks and a walking-path guide. These models are <b>separate candidates</b>; they are not installed into student mansions.</p><div id="view"></div><pre id="audit">Loading…</pre></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const el=document.querySelector('#view'),info=document.querySelector('#audit');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);el.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x141a25);scene.add(new THREE.HemisphereLight(0xd8e5ff,0x39231f,2.3));const key=new THREE.DirectionalLight(0xffdfae,2.9);key.position.set(3,7,4);scene.add(key);const cam=new THREE.PerspectiveCamera(48,el.clientWidth/el.clientHeight,.04,100);cam.position.set(4.7,4.2,5);const control=new OrbitControls(cam,renderer.domElement);control.enableDamping=true;control.target.set(-.5,1.5,0);const loader=new GLTFLoader();
try{const a=await fetch('houses/ferres-estate/navigation/serpent_aligned_traversal.json').then(r=>{if(!r.ok)throw Error('Missing audit file');return r.json()});for(const rel of [a.model]){const gltf=await loader.loadAsync('houses/ferres-estate/'+rel);scene.add(gltf.scene)}const points=a.routeLocalMeters.map(p=>new THREE.Vector3(p.x,p.y,p.z));const curve=new THREE.BufferGeometry().setFromPoints(points);const line=new THREE.Line(curve,new THREE.LineBasicMaterial({color:0x67edc5}));scene.add(line);for(const p of [points[0],points[points.length-1]]){const marker=new THREE.Mesh(new THREE.SphereGeometry(.08),new THREE.MeshBasicMaterial({color:0xffdf80}));marker.position.copy(p);scene.add(marker)}info.textContent='Prototype with 360° rotation, 18 physical wedge treads and continuous route markers.\nRiser: '+a.riserMeters+' m\nWalking-line tread: '+a.walkingGoingMeters+' m\nBoth doorway sides: '+a.doorAlignmentBothFloors+'\nFootprint candidate: '+a.nominalFootprintFit+'\n\nUNVERIFIED: actual slab mesh opening, whole-body collision, full helical headroom and mansion entry/exit.\nGameplay certified: '+a.gameplayCertified;}catch(e){info.textContent='Unable to load model: '+e.message}
function frame(){requestAnimationFrame(frame);control.update();renderer.render(scene,cam)}frame();new ResizeObserver(()=>{renderer.setSize(el.clientWidth,el.clientHeight);cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix()}).observe(el);
</script><script src="forge_pages.js" defer></script></body></html>
