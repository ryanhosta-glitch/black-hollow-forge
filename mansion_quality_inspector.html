<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge Mansion Quality Inspector</title><style>body{background:#14111c;color:#eee0c6;font:16px system-ui;max-width:850px;margin:30px auto;padding:20px}a{color:#f5bd85}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #56445c;padding:11px;text-align:left} .warning{color:#ffb36d}</style><a href="index.html">← Forge</a><h1>Mansion Quality Inspector</h1><p>Reports measured data without assigning an inflated quality score for untested runtime features.</p><div id="report">Loading measured report…</div><script type="module">const d=await(await fetch('houses/ferres-estate/navigation/mansion_quality_report.json')).json();const area=document.getElementById('report');area.replaceChildren();function p(s){let e=document.createElement('p');e.textContent=s;area.append(e)}p(`Rooms: ${d.rooms} · Door groups: ${d.doors} · Proposed furniture: ${d.proposedFurniture} · Graph links: ${d.connectionLinks}`);p(`Stairs gameplay certified: ${d.certifiedStairRoutes}/${d.stairRoutes}`);p(`Readiness: ${d.grade}`);const t=document.createElement('table');for(const [key,value] of Object.entries(d.checks)){const tr=t.insertRow();tr.insertCell().textContent=key.replace(/[A-Z]/g,c=>' '+c);tr.insertCell().textContent=value}area.append(t);p(`Recorded findings: ${d.issues.length}`);for(const issue of d.issues.slice(0,35))p(`${issue.severity.toUpperCase()}: ${issue.message}`);p(d.scoringPolicy)</script></html>
