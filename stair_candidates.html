<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Hollow — Stair Candidate Inspector</title><style>body{margin:0;background:#10151c;color:#f6eee2;font:15px system-ui}header{padding:16px 22px;background:#202733;display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:#e5bf84}main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 70px)}aside{padding:18px;background:#1e2631}#view{height:calc(100vh - 70px)}button{display:block;width:100%;padding:12px;margin:8px 0;background:#353e4a;border:1px solid #8f7d60;border-radius:8px;color:white;cursor:pointer;text-align:left}button[aria-pressed=true]{background:#6d5436}p{line-height:1.5}small{color:#d2c5ad}@media(max-width:700px){main{display:block}#view{height:55vh}}</style><header><b>BLACK HOLLOW — STAIR CANDIDATE INSPECTOR</b><a href="index.html">Return to Forge</a><a href="stair_audit.html">Layout audit</a></header><main><aside><h2>Proposed stair flights</h2><p>Models are <b>geometric candidates only</b>. They do not yet connect to cut floor slabs or certified collision.</p><div id="links"></div><p id="status">Loading candidate report…</p><small>Drag to orbit; scroll to zoom. All dimensions in meters.</small></aside><div id="view"></div></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';const container=document.getElementById('view'),status=document.getElementById('status');let scene=new THREE.Scene();scene.background=new THREE.Color('#29313e');const camera=new THREE.PerspectiveCamera(48,1,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));container.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x626d80,2));let light=new THREE.DirectionalLight(0xffedcc,2.2);light.position.set(8,15,11);scene.add(light);const grid=new THREE.GridHelper(10,20,0x53657b,0x435366);scene.add(grid);let model;const loader=new GLTFLoader();function resize(){let w=container.clientWidth,h=container.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}tick();function select(item){for(let b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.id===item.linkId));if(model){scene.remove(model);model=null}status.textContent='Loading '+item.linkId+'…';if(!item.model){status.textContent='No geometric candidate for this link';return}const url='houses/ferres-estate/'+item.model;loader.load(url,g=>{model=g.scene;scene.add(model);const b=new THREE.Box3().setFromObject(model),c=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3());controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(Math.max(4,size.x*2),Math.max(4,size.y*1.5),Math.max(5,size.z*2)));camera.lookAt(c);controls.update();status.textContent=item.status+' — missing floor cuts and physical collision checks'},undefined,e=>status.textContent='Unable to load '+url+': '+e.message)}fetch('houses/ferres-estate/navigation/stair_candidate_layouts.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{const host=document.getElementById('links');for(let x of data.links){let b=document.createElement('button');b.textContent=x.linkId+' — '+x.design.scheme;b.dataset.id=x.linkId;b.onclick=()=>select(x);host.appendChild(b)}if(data.links.length)select(data.links[0])}).catch(e=>status.textContent='Could not load stair report: '+e.message)</script></html>
