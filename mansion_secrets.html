<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Forge · Mansion Secrets</title><style>body{margin:0;background:#10141c;color:#efe3cd;font:16px system-ui;padding:24px;max-width:880px;margin-inline:auto}h1{font-family:Georgia,serif}article{border:1px solid #605344;background:#1a2029;border-radius:14px;margin:14px 0;padding:17px}small{color:#bdaf99}strong{color:#f2c981}a{color:#f0c77f}summary{cursor:pointer}select{padding:11px;background:#222b36;color:#fff;border:1px solid #837456;border-radius:7px}#status{color:#d8bf8a}</style></head><body><h1>🗝️ Mansion Secrets</h1><p>Forge's proposed secret opportunities. These do not add doors or chambers to the student blueprint. Game activation and collision checks are still pending.</p><p><a href="index.html">← Main Estate Viewer</a></p><p id="status">Loading catalogue…</p><label>Floor <select id="floor"><option value="all">All floors</option></select></label><div id="items"></div><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;function render(){const sel=document.getElementById('floor').value;document.getElementById('items').innerHTML=data.secrets.filter(x=>sel==='all'||String(x.floorIndex)===sel).map(x=>`<article><small>${esc(x.floorName)} · ${esc(x.roomName)}</small><h2>${esc(x.type.replaceAll('_',' '))}</h2><p>${esc(x.displayText)}</p><p><strong>Haunting tier:</strong> ${esc(x.hauntingTier.replaceAll('_',' '))} · Stage ${x.progressionRank}</p><p><strong>Effect:</strong> ${esc(x.realityEffect.replaceAll('_',' '))}</p><p><strong>Mechanism:</strong> ${esc(x.interaction.replaceAll('_',' '))}</p><small>Proposed existing ${esc(x.placement.wall)} wall · ${esc(x.status)}</small></article>`).join('')||'<p>No proposals for this floor.</p>'}fetch('houses/ferres-estate/navigation/forge_secrets.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;document.getElementById('status').textContent=`${d.counts.proposed} escalating proposals (${Object.entries(d.counts.byTier).map(([k,v])=>k.replaceAll('_',' ')+': '+v).join(' · ')}) across ${d.counts.eligible} eligible rooms · ${d.counts.rooms} rooms reviewed.`;[...new Set(d.secrets.map(x=>x.floorIndex))].forEach(i=>{let x=d.secrets.find(s=>s.floorIndex===i);let o=document.createElement('option');o.value=i;o.textContent=x.floorName;document.getElementById('floor').append(o)});document.getElementById('floor').addEventListener('change',render);render()}).catch(e=>document.getElementById('status').textContent='Cannot load proposals: '+e.message);</script></body></html>
