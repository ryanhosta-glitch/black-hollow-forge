<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Forge → Black Hollow Integration Gate</title><style>
html,body{margin:0;height:100%;background:#090c16;color:#f1dfc8;font:14px system-ui}canvas{display:block;width:100%;height:100%}.panel{position:fixed;z-index:2;left:12px;top:12px;width:min(360px,calc(100vw - 44px));padding:13px;background:#111322e9;border:1px solid #977c58;border-radius:12px;max-height:64vh;overflow:auto}h1{font:21px Georgia;margin:0 0 8px}button{min-height:42px;border-radius:8px;border:1px solid #a38c6b;background:#332942;color:#f6e7d3;padding:8px;margin:3px;cursor:pointer}.muted{color:#b7acc1}#result{white-space:pre-wrap;line-height:1.45;font-size:12px;margin-top:10px}.hint{position:fixed;bottom:14px;left:12px;background:#151524d9;padding:7px;border-radius:7px;font-size:12px}@media(max-width:600px){.panel{max-height:43vh;padding:10px}.hint{font-size:11px}}
</style><link rel="stylesheet" href="forge_pages.css"></head><body><div class="panel"><h1>First Fully Forged Mansion</h1><p class="muted">Actual compiled GLBs · contract validation · mobile orbit inspection. Not yet proof of game-ready physics.</p><div><button id="inspect">Inspect contract</button><button id="show">Toggle roof</button><button id="frame">Frame estate</button></div><div id="result">Loading compiled mansion…</div></div><div class="hint">Drag to orbit · Pinch or scroll to zoom · Every model is loaded from the actual Forge export</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
import {loadForgeContract,addForgeGeometry,gameReadiness} from './game_import/forge_house_adapter.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color('#121827');scene.fog=new THREE.FogExp2('#121827',.009);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.08,1000);camera.position.set(48,34,52);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc6d6ff,0x17111c,2.4));const light=new THREE.DirectionalLight(0xffdfb1,3);light.position.set(-15,40,30);scene.add(light);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(8,7,6);
const result=document.getElementById('result');let loaded,contract;
function frame(){if(!loaded)return;const bb=new THREE.Box3().setFromObject(loaded.group);if(bb.isEmpty())return;const center=bb.getCenter(new THREE.Vector3()),extent=bb.getSize(new THREE.Vector3());orbit.target.copy(center);camera.position.copy(center.clone().add(new THREE.Vector3(extent.x*.95,extent.y*.9+8,extent.z*1.25+12)));orbit.update();}
try{contract=await loadForgeContract('./houses/ferres-estate');loaded=await addForgeGeometry(contract,{THREE,GLTFLoader,scene});frame();const readiness=gameReadiness(contract);result.textContent=`GEOMETRY IMPORTED ✓\n${contract.manifest.name}: ${contract.navigation.rooms.length} rooms across ${contract.manifest.floors.length} floors.\n\nGame integration: NOT CERTIFIED.\n${readiness.warnings.map(w=>'⚠ '+w).join('\n')}`;}catch(e){result.textContent='IMPORT FAILED: '+e.message;console.error(e);}
document.getElementById('frame').onclick=frame;document.getElementById('show').onclick=()=>{const roof=loaded?.group.children.find(c=>c.name==='Forge roof');if(roof)roof.visible=!roof.visible;};document.getElementById('inspect').onclick=()=>{if(contract){const r=gameReadiness(contract);result.textContent=JSON.stringify({entry:contract.entry,roomCount:contract.rooms.size,floorElevations:loaded.elevations,readiness:r},null,2)}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();
</script><script src="forge_pages.js" defer></script></body></html>
