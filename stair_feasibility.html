<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forge Stair Feasibility</title><link rel="stylesheet" href="forge_pages.css"><style>body{background:#0b1018;color:#ede2cc;font:16px system-ui;margin:0;padding:24px;max-width:950px}h1{font-family:Georgia;color:#e6c394}article{margin:12px 0;padding:15px;background:#1a222e;border:1px solid #765a49;border-radius:12px}small{color:#b7b7c2}strong{color:#ebcb89}a{color:#e5c991}</style></head><body><h1>Measured Stair Feasibility</h1><p>Conservative route measurements; never a substitute for physical collision or actual gameplay certification.</p><p><a href="walktest.html">Open walk test</a></p><div id="content">Loading…</div><script src="forge_pages.js" defer></script><script>fetch('houses/ferres-estate/navigation/stair_feasibility.json').then(r=>r.json()).then(j=>{const c=document.getElementById('content');c.textContent='';const intro=document.createElement('p');intro.textContent=j.totalLinks+' authored vertical links analyzed · Game certification: NO';c.append(intro);j.links.forEach(x=>{const a=document.createElement('article'),h=document.createElement('h3');h.textContent=x.fromRoom+' → '+x.toRoom;const t=document.createElement('p');t.textContent='Rise: '+x.riseMeters.toFixed(2)+' m · Minimum horizontal walking run: '+x.minimumStraightRunMeters.toFixed(2)+' m · Landing candidate: '+x.landingCandidate;const w=document.createElement('p');w.textContent='Remaining: '+x.remaining.join('; ')+(x.warnings.length?' · WARNINGS: '+x.warnings.join(', '):'');a.append(h,t,w);c.append(a)})}).catch(e=>document.getElementById('content').textContent=e.message)</script></body></html>
