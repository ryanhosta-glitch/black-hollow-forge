<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Hollow Forge 0.3 · House Viewer</title><style>
:root{color-scheme:dark}body{margin:0;background:#090a10;color:#f5ecff;font:14px system-ui}canvas{display:block;position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;top:12px;left:12px;width:min(355px,calc(100vw - 38px));padding:16px;background:#130d1de8;border:1px solid #8e70a9;border-radius:13px;max-height:85vh;overflow:auto;box-shadow:0 8px 38px #0009}h1{font:25px Georgia;margin:0 0 7px;color:#e6bfff}p{line-height:1.4;margin:6px 0 12px;color:#d5c9de}button,select{background:#342443;border:1px solid #8565a1;border-radius:6px;color:#fff;padding:8px;cursor:pointer;font:inherit}button:hover{background:#584073}select{max-width:100%;width:100%;margin:5px 0 10px}#moves button{width:100%;text-align:left;margin:3px 0;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;color:#d6b0fc}#status{color:#c9ffaa;font-size:12px;margin-top:8px}.legend{position:fixed;bottom:10px;left:12px;max-width:420px;background:#120d1cd9;border:1px solid #604873;padding:10px;border-radius:8px;font-size:12px;color:#cfc2d8}@media(max-width:700px){.hud{width:255px;padding:10px}h1{font-size:21px}}
</style></head><body><canvas id="view"></canvas><div class="hud"><h1>BLACK HOLLOW FORGE</h1><div class="tag">0.3 · Compiled house integration test</div><p id="house">Loading Ferre's Estate…</p><label for="floor">Floor</label><select id="floor"></select><label for="room">Current room</label><select id="room"></select><div class="actions"><button id="roof">Roof: OFF</button><button id="look">Camera: orbit</button><button id="main">Grand Main Hall</button><button id="conservatory">Floor 13 Conservatory</button></div><h3>Connected destinations</h3><div id="moves"></div><div id="status" role="status"></div></div><div class="legend">Mouse: rotate • Scroll: zoom • Use connected destination buttons for topology-validated door/stair/elevator travel. This viewer is a navigation test, not yet the full v8.5.19 game.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id);const base='./houses/ferres-estate/';const json=async p=>{const r=await fetch(base+p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()};
const renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color('#0b0c13');const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,600);camera.position.set(24,28,35);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(8,0,6);scene.add(new THREE.HemisphereLight(0xdbe5ff,0x403344,2));const sun=new THREE.DirectionalLight(0xffedc1,2.8);sun.position.set(16,32,11);scene.add(sun);const grid=new THREE.GridHelper(90,45,0x53526a,0x333446);scene.add(grid);
const loader=new GLTFLoader();function loadGLB(file){return new Promise((yes,no)=>loader.load(base+file,g=>yes(g.scene),undefined,no))};let manifest,nav,magic,levelModels=[],roofModel=null,specialModel=null,roomId='',floorId='',roofVisible=false,lookMode='orbit';
function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();function resized(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}window.addEventListener('resize',resized);resized();
const rooms=()=>nav.rooms;const getRoom=id=>rooms().find(r=>r.id===id);function setStatus(s){$('status').textContent=s}function showMainFloor(){if(specialModel){scene.remove(specialModel);specialModel=null}for(const a of levelModels)a.visible=a.userData.id===floorId;if(roofModel)roofModel.visible=roofVisible&&floorId===manifest.floors.at(-1).id}
function focusRoom(r){if(!r)return;const b=r.boundsFeet,c=.3048;const x=(b.x+b.l/2)*c,z=(b.y+b.w/2)*c;const target=new THREE.Vector3(x,0,z);controls.target.copy(target);camera.position.set(x+Math.max(5,b.l*c*.85),Math.max(7,b.h*c*3.2),z+Math.max(5,b.w*c*1.5));controls.update();}
function destText(c){const other=c.a===roomId?c.b:c.a;const r=getRoom(other);const name=r?r.name:other;return (c.type==='magical-elevator'?'✦ Spectral Elevator → ':c.type.includes('stair')?'⇅ Stairs → ':c.type.includes('elevator')?'⇅ Elevator → ':'🚪 Door → ')+name+(r?' (floor '+(r.floor+1)+')':'')}
function renderDest(){const m=$('moves');m.replaceChildren();const links=magic.connections.filter(c=>c.a===roomId||c.b===roomId);for(const c of links){const dest=c.a===roomId?c.b:c.a;if(!getRoom(dest))continue;const b=document.createElement('button');b.textContent=destText(c);b.onclick=()=>selectRoom(dest);m.append(b)}if(!links.length)m.textContent='No links. Check Forge diagnostics.'}
function selectRoom(id){const r=getRoom(id);if(!r)return;roomId=id;floorId=manifest.floors[r.floor].id;$('floor').value=floorId;populateRooms();$('room').value=id;showMainFloor();focusRoom(r);renderDest();setStatus(r.name+' • '+(r.roomType||r.type)+' • '+magic.connections.filter(c=>c.type==='magical-elevator'&&(c.a===id||c.b===id)).length+' spectral link(s)')}
function populateRooms(){const rs=rooms().filter(r=>manifest.floors[r.floor].id===floorId);$('room').replaceChildren(...rs.map(r=>new Option(r.name,r.id)))}
async function showSpecial(file){try{if(specialModel)scene.remove(specialModel);for(const m of levelModels)m.visible=false;if(roofModel)roofModel.visible=false;specialModel=await loadGLB(file);scene.add(specialModel);const b=new THREE.Box3().setFromObject(specialModel),c=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3()).length();controls.target.copy(c);camera.position.copy(c.clone().add(new THREE.Vector3(size*.45,size*.37,size*.42)));setStatus('Showing separate architectural scene: '+file)}catch(e){setStatus(e.message)}}
async function start(){try{[manifest,nav,magic]=await Promise.all([json('manifest.json'),json('navigation/collision.json'),json('navigation/magic.json')]);$('house').textContent=manifest.name+' · '+manifest.floors.length+' levels · '+nav.rooms.length+' spaces';for(const f of manifest.floors){const mesh=await loadGLB(f.model);mesh.userData.id=f.id;mesh.visible=false;scene.add(mesh);levelModels.push(mesh);$('floor').append(new Option(f.name,f.id))}if(manifest.roof){roofModel=await loadGLB(manifest.roof);roofModel.visible=false;scene.add(roofModel)}$('floor').onchange=()=>{const f=manifest.floors.find(x=>x.id===$('floor').value),r=rooms().find(x=>x.floor===manifest.floors.indexOf(f));if(r)selectRoom(r.id)};$('room').onchange=()=>selectRoom($('room').value);$('roof').onclick=()=>{roofVisible=!roofVisible;$('roof').textContent='Roof: '+(roofVisible?'ON':'OFF');showMainFloor()};$('look').onclick=()=>{lookMode=lookMode==='orbit'?'top':'orbit';$('look').textContent='Camera: '+lookMode;const r=getRoom(roomId);if(r)focusRoom(r);if(lookMode==='top'){const p=controls.target;camera.position.set(p.x,35,p.z+.01)}};$('main').onclick=()=>showSpecial(manifest.specialRooms.mainHall);$('conservatory').onclick=()=>showSpecial(manifest.specialRooms.floor13Conservatory);selectRoom(manifest.entry.roomId);setStatus('GLB floors loaded. '+magic.connections.length+' navigational connections. '+magic.repairs.length+' magical repairs.')}catch(e){setStatus('Load failed: '+e.message+' — run via HTTP (not file://).');console.error(e)}}start();
</script></body></html>
