<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge · Stair Slab Inspector</title><style>body{margin:0;background:#10131a;color:#e7dcca;font:15px system-ui}header{padding:13px 18px;background:#202331}button{padding:8px 15px;background:#75553b;color:white;border:1px solid #b89667;border-radius:6px;cursor:pointer}aside{position:fixed;top:80px;left:16px;width:320px;background:#1b2028e8;padding:14px;border:1px solid #a18a68;border-radius:9px}canvas{display:block}small{color:#c5baab}</style></head><body><header><b>Black Hollow Forge — Actual Floor Slab Cutouts</b> · Inspection geometry, not gameplay certification</header><aside><button id="reset">Fit model</button><button id="switch">Stack / Isolate floor</button><p id="state">Loading…</p><small>Mouse drag rotates · scroll zooms. Gold outlines indicate cutouts. Stair routes remain unverified for full collision.</small></aside><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color('#1a212b');const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x526078,2.0));const sun=new THREE.DirectionalLight(0xffe9cf,2.2);sun.position.set(20,30,10);scene.add(sun);const loader=new GLTFLoader();const group=new THREE.Group();scene.add(group);let isolated=false;function fit(){const b=new THREE.Box3().setFromObject(group);const ctr=b.getCenter(new THREE.Vector3());const dist=b.getSize(new THREE.Vector3()).length();controls.target.copy(ctr);camera.position.set(ctr.x+dist*.75,ctr.y+dist*.65,ctr.z+dist*.8);controls.update()}Promise.all([0,1,2,3].map(i=>new Promise((resolve,reject)=>loader.load('houses/ferres-estate/geometry/floor_0'+i+'.glb',g=>{g.scene.position.y=i*3.048;g.scene.userData.floor=i;group.add(g.scene);resolve()},undefined,reject)))).then(()=>{fit();document.getElementById('state').textContent='Loaded four floor GLBs. Two upper stairwell shafts are cut through the exported floor slabs.'}).catch(e=>document.getElementById('state').textContent='GLB load error: '+e.message);document.getElementById('reset').onclick=fit;document.getElementById('switch').onclick=()=>{isolated=!isolated;for(let i=0;i<group.children.length;i++)group.children[i].visible=!isolated||group.children[i].userData.floor===1;fit();};window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});</script></body></html>
