<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge Furniture Library</title><link rel="stylesheet" href="forge_pages.css"><style>body{background:#10131b;color:#e8decf;font:16px system-ui;margin:0;padding:24px 14px 90px}main{max-width:950px;margin:auto}h1{color:#deb891}p{line-height:1.55;color:#c7c5c2}select,input,button{font:inherit;padding:11px;background:#222b37;border:1px solid #71645c;color:#fff;border-radius:10px}input{max-width:100%;box-sizing:border-box}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;margin-top:20px}.item{background:#1b222d;border:1px solid #655647;border-radius:14px;padding:16px}.item h3{margin:0 0 6px}.item small{color:#bfc7d2}.item button{margin:8px 6px 0 0;cursor:pointer;touch-action:manipulation}.item output{display:block;color:#d8ba7e;margin-top:8px}.controls{display:flex;flex-wrap:wrap;gap:8px}#info{color:#eec998}button:disabled{opacity:.45}</style></head><body><main><h1>🗝 The Interactive Furniture Library</h1><p><a href="furniture_in_mansion.html" style="color:#edc88c">Explore placed furniture in the actual 3D mansion →</a></p><p>Test the action logic for items planned across Ferre's Estate. This is a mobile-friendly behavior catalog—not a claim of finished furniture models or game collision.</p><div class="controls"><select id="floor"><option value="all">All floors</option><option value="0">Basement</option><option value="1">Ground floor</option><option value="2">Second floor</option><option value="3">Third floor</option></select><input id="search" placeholder="Search rooms or furniture" aria-label="Search room or object"></div><p id="info">Loading library…</p><section id="items"></section></main><script src="forge_pages.js"></script><script type="module">import {createLibraryRuntime} from './furniture_library_runtime.mjs';const info=document.querySelector('#info'), items=document.querySelector('#items'),floor=document.querySelector('#floor'),search=document.querySelector('#search');try{const resp=await fetch('houses/ferres-estate/navigation/furniture_library.json');if(!resp.ok)throw Error('Could not read library');const lib=await resp.json(),runtime=createLibraryRuntime(lib);function render(){const q=search.value.toLowerCase().trim(),f=floor.value;const visible=lib.assets.filter(a=>(f==='all'||String(a.floor)===f)&&(!q||[a.roomName,a.archetype,a.behavior].join(' ').toLowerCase().includes(q)));info.textContent=`${visible.length} of ${lib.assets.length} object plans • state demonstration only • clearance unverified`;items.replaceChildren();for(const a of visible){const el=document.createElement('article');el.className='item';const h=document.createElement('h3');h.textContent=a.archetype.replaceAll('_',' ');el.append(h);const sub=document.createElement('small');sub.textContent=`${a.roomName} · Floor ${a.floor} · ${a.behavior}`;el.append(sub);const state=document.createElement('output');el.append(state);function update(){const s=runtime.get(a.id).state;state.textContent=a.behavior==='chair'?(s.occupied?'Occupied':'Unoccupied'):a.behavior==='inspect'?'Inspect only':(s.open?'Open':'Closed')}update();for(const action of a.actions){const b=document.createElement('button');b.textContent=action[0].toUpperCase()+action.slice(1);b.addEventListener('click',()=>{const result=runtime.interact(a.id,action,{distanceMeters:1});if(!result.ok)state.textContent=result.reason;else update()});el.append(b)}items.append(el)}}floor.addEventListener('change',render);search.addEventListener('input',render);render()}catch(err){info.textContent='Unable to load library: '+err.message}</script></body></html>
